# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

stages:
  - Run tests
  - release

"Run on Perl":
  stage: Run tests
  parallel:
    matrix:
      - PERL_VERSION: ["5.36", "5.38", "5.40", "5.42"]
  image: perl:${PERL_VERSION}
  before_script:
    - cpanm --installdeps --notest .
  script:
    - JUNIT_OUTPUT_FILE=junit.xml prove -lr t/ --harness=TAP::Harness::JUnit
  artifacts:
    reports:
      junit: junit.xml
    when: always

check-changelog:
  stage: Run tests
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      if ! grep -q "^## \[Unreleased\]" CHANGELOG.md; then
        echo "ERROR: '## [Unreleased]' section missing from CHANGELOG.md"
        exit 1
      fi
    - |
      if git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" | grep -q "^CHANGELOG.md$"; then
        echo "CHANGELOG.md updated. OK."
      else
        echo "ERROR: CHANGELOG.md was not updated in this merge request."
        echo "Please add an entry under '## [Unreleased]' describing your changes."
        exit 1
      fi

tag-release:
  stage: release
  image: alpine:latest
  # NOTE: CI_JOB_TOKEN must be allowed to push to the default branch.
  # If your branch protection rules block this, create a Project Access Token
  # with 'write_repository' scope, store it as CI variable RELEASE_TOKEN, and
  # replace CI_JOB_TOKEN with RELEASE_TOKEN in the remote URL below.
  before_script:
    - apk add --no-cache git perl
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - lib/GitBz/Version.pm
  script:
    - VERSION=$(perl -ne "print \$1 if /our \\\$VERSION = '([^']+)'/" lib/GitBz/Version.pm)
    - echo "Version in Version.pm is ${VERSION}"
    - |
      if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
        echo "Tag ${VERSION} already exists, skipping."
        exit 0
      fi
    - perl scripts/stamp-changelog.pl "$VERSION"
    - git config user.email "ci@gitlab"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git add CHANGELOG.md
    - git commit -m "Release ${VERSION}"
    - git tag "$VERSION"
    - git push origin HEAD:$CI_DEFAULT_BRANCH "$VERSION"
    - echo "Tagged and pushed ${VERSION}"

sast:
  stage: Run tests

include:
  - template: Security/SAST.gitlab-ci.yml
